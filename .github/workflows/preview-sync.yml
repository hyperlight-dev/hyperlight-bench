name: PR Preview Sync

on:
  pull_request:
    types: [synchronize, converted_to_draft, closed, labeled, unlabeled, edited]

permissions: {}

jobs:
  notify:
    if: >-
      (github.event.action != 'closed' || !github.event.pull_request.merged) &&
      (!(github.event.action == 'labeled' || github.event.action == 'unlabeled') || github.event.label.name == 'benchmarks: skip') &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'true'
