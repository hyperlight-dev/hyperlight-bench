name: Pages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publication:
        type: boolean
        default: false
  workflow_run:
    workflows: [PR Preview, PR Preview Sync]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: >-
    ${{ (
      inputs.publication || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    ) && 'pages-deployment' || format('pages-ignored-{0}-{1}', github.run_id, github.run_attempt) }}
  queue: max

jobs:
  assemble:
    if: >-
      inputs.publication || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trusted-sha: ${{ steps.revision.outputs.sha }}
      marker: ${{ steps.marker.outputs.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build -- --base ./
        env:
          VITE_HISTORY_URL: ./data/index.json
      - run: node scripts/site-ci.ts assemble
        env:
          GH_TOKEN: ${{ github.token }}
      # The CDN caches 404s, so each deploy check polls a path nobody requested before.
      - id: marker
        run: |
          marker="deploy-marker/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "site/$marker"
          for n in $(seq 1 30); do echo "$n" > "site/$marker/$n"; done
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - uses: actions/upload-artifact@v7
        with:
          name: site-state
          path: site-state.json
          if-no-files-found: error

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.assemble.outputs.trusted-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: site-state
          path: ${{ runner.temp }}/site-state
      - run: node scripts/site-ci.ts verify "$RUNNER_TEMP/site-state/site-state.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v5
      # Pages can report success and keep serving the previous deployment.
      - name: Require Pages to serve this deployment
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          MARKER: ${{ needs.assemble.outputs.marker }}
        run: |
          for n in $(seq 1 30); do
            if curl -fs --max-time 10 -o /dev/null "${SITE_URL%/}/$MARKER/$n"; then
              echo "Pages serves this deployment after $n checks"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages still serves an older deployment. Rerun the deploy job."
          exit 1