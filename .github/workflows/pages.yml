name: Pages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publication:
        type: boolean
        default: false
  workflow_run:
    workflows: [PR Preview]
    types: [completed]
  pull_request_target:
    types: [synchronize, converted_to_draft, closed, labeled, unlabeled, edited]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: >-
    ${{ (
      inputs.publication || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'closed' || !github.event.pull_request.merged) &&
      (!(github.event.action == 'labeled' || github.event.action == 'unlabeled') || github.event.label.name == 'benchmarks: skip') &&
      (github.event.action != 'edited' || github.event.changes.base)
    ) && 'pages-deployment' || format('pages-ignored-{0}-{1}', github.run_id, github.run_attempt) }}
  queue: max

jobs:
  assemble:
    if: >-
      inputs.publication || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'closed' || !github.event.pull_request.merged) &&
      (!(github.event.action == 'labeled' || github.event.action == 'unlabeled') || github.event.label.name == 'benchmarks: skip') &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trusted-sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build -- --base ./
        env:
          VITE_HISTORY_URL: ./data/index.json
      - run: node scripts/site-ci.ts assemble
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - uses: actions/upload-artifact@v7
        with:
          name: site-state
          path: site-state.json
          if-no-files-found: error

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.assemble.outputs.trusted-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: site-state
          path: ${{ runner.temp }}/site-state
      - run: node scripts/site-ci.ts verify "$RUNNER_TEMP/site-state/site-state.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v5