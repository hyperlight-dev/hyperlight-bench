name: Benchmark Publication

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  publish:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    concurrency:
      group: benchmark-data-publication
      queue: max
    permissions:
      contents: write
      statuses: write
      actions: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - id: publish
        run: node scripts/publish-ci.ts
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.publish.outputs.changed == 'true') }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      publication: true