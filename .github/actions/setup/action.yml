name: Setup environment
description: Setup Rust and required tools for benchmarking

inputs:
  HYPERVISOR:
    description: 'hypervisor to use (kvm, mshv, mshv3)'
    required: true
  CPU_VENDOR:
    description: 'CPU vendor to use (amd, intel)'
    required: true
  CACHE_SCOPE:
    description: 'cache scope and version'
    required: false
    default: 'build-v2'
  SAVE_CACHES:
    description: 'save updated caches from a designated writer job'
    required: false
    default: 'false'
  BENCH_ONLY:
    description: 'install only tools required to run benchmarks'
    required: false
    default: 'false'

outputs:
  CACHE_HIT:
    description: 'whether the Rust cache had an exact match'
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
  # - name: Install Rust
  #   uses: dtolnay/rust-toolchain@1.85

  - name: check if rust/cargo is on path
    shell: bash
    run: |
      export CARGO_HOME=/opt/cargo
      export PATH="$CARGO_HOME/bin:$PATH"
      echo "CARGO_HOME=$CARGO_HOME" >> $GITHUB_ENV
      echo "PATH=$PATH" >> $GITHUB_ENV

      echo "Checking environment variables..."
      if [ -n "$CARGO_HOME" ]; then
        echo "CARGO_HOME is set: $CARGO_HOME"
      else
        echo "CARGO_HOME is not set or empty"
      fi
      
      if [ -n "$RUSTUP_HOME" ]; then
        echo "RUSTUP_HOME is set: $RUSTUP_HOME"
      else
        echo "RUSTUP_HOME is not set or empty"
      fi
      
      echo "PATH before sourcing: $PATH"
      
      # Check and source cargo environment
      echo "Checking cargo environment files..."
      if [ -f /opt/cargo/env ]; then
        echo "Found /opt/cargo/env, sourcing it..."
        cat /opt/cargo/env
        source /opt/cargo/env
      else
        echo "/opt/cargo/env not found"
      fi
      
      cat /etc/profile.d/cargo_env.sh || echo "No cargo_env.sh found"
      
      echo "PATH after sourcing: $PATH"
      
      echo "Checking if Rust and Cargo are now available..."
      if command -v rustc &> /dev/null && command -v cargo &> /dev/null; then
        echo "✅ Rust and Cargo are available on PATH"
        echo "rustc version: $(rustc --version)"
        echo "cargo version: $(cargo --version)"
        # Make PATH available to subsequent steps
        echo "PATH=$PATH" >> $GITHUB_ENV
      else
        echo "❌ Rust or Cargo is still not available on PATH"
      fi

  # Remove after runner images include the /opt/cargo ownership fix.
  - name: Make Cargo home writable
    shell: bash
    run: sudo chown -R "$USER" "$CARGO_HOME"

  - name: Restore Rust cache
    id: rust-cache
    uses: Swatinem/rust-cache@v2
    with:
      shared-key: ${{ inputs.HYPERVISOR }}-${{ inputs.CPU_VENDOR }}-${{ inputs.CACHE_SCOPE }}-${{ hashFiles('tool-versions.sh') }}
      workspaces: |
        . -> target
        crates/handler-rs -> target
        crates/hyperlight-dummy-guest -> target
      save-if: ${{ inputs.SAVE_CACHES == 'true' }}

  - name: Install Rust tools
    shell: bash
    run: |
      echo "Checking for cached tools..."
      ls -la /opt/cargo/bin/ || echo "/opt/cargo/bin/ doesn't exist yet"
      
      # Verify cargo is available (should be from previous step via GITHUB_ENV)
      if ! command -v cargo &> /dev/null; then
        echo "❌ Cargo not available, PATH may not have been set correctly"
        echo "Current PATH: $PATH"
        exit 1
      fi
      
      echo "✅ Cargo is available: $(cargo --version)"

      if [[ "${{ inputs.BENCH_ONLY }}" != "true" ]]; then
        scripts/setup-tools.sh
      else
        scripts/setup-tools.sh --bench-only
      fi
      
      echo "Final tool status:"
      ls -la /opt/cargo/bin/

